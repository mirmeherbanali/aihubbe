name: CI Pipeline

on:
  push:
    branches: ["dev", "trunk"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set environment based on branch
      run: |
        if [[ "${GITHUB_REF##*/}" == "trunk" ]]; then
          echo "ENV_FILE=.env.production" >> $GITHUB_ENV
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
        else
          echo "ENV_FILE=.env" >> $GITHUB_ENV
          echo "IMAGE_TAG=dev" >> $GITHUB_ENV
        fi

    - name: Copy correct .env file
      run: cp $ENV_FILE .env

    - name: Login to Docker Hub
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD

    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/aihubbe:${{ env.IMAGE_TAG }} .

    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/aihubbe:${{ env.IMAGE_TAG }}
